services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: hexastra-db
    environment:
      POSTGRES_DB: hexastra
      POSTGRES_USER: hexastra
      POSTGRES_PASSWORD: ${HEXASTRA_DB_PASSWORD:-hexastra-local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hexastra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexastra -d hexastra"]
      interval: 5s
      retries: 12
  planetary:
    build: ./services/planetary
    ports:
      - "8766:8766"
  earth:
    build: ./services/earth
    ports:
      - "8767:8767"
    environment:
      PLANETARY_URL: http://planetary:8766
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
      CDSE_USERNAME: ${CDSE_USERNAME:-}
      CDSE_PASSWORD: ${CDSE_PASSWORD:-}
  front:
    image: python:3.9-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python -m http.server 8765 --bind 0.0.0.0
    ports:
      - "8765:8765"
    depends_on:
      - planetary
      - earth

volumes:
  hexastra-db-data:
